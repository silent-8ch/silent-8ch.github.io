<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Happy Birthday 💛</title>
<style>
  :root{
    --wall:#87ceeb;
    --wall2:#5fb5d9;
    --floor:#f0d9a0;
    --floor2:#e6c888;
    --ink:#4a3a30;
    --accent:#e07a8b;
    --accent2:#f2a6b3;
    --good:#7fb77e;
    --warn:#e0a35a;
    --bad:#d46a6a;
    --panel:#fff7ef;
    --shadow:rgba(74,58,48,.18);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;}
  body{
    font-family:'Segoe UI',system-ui,sans-serif;
    background:#2a211c;
    color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    min-height:100%;
    overflow:hidden;
    -webkit-user-select:none;user-select:none;
    touch-action:manipulation;
  }
  #game{
    position:relative;
    width:min(96vw, 96vh * 0.62);
    max-width:520px;
    aspect-ratio:9/16;
    background:var(--panel);
    border-radius:22px;
    box-shadow:0 24px 60px rgba(0,0,0,.5);
    overflow:hidden;
    display:flex;flex-direction:column;
  }
  /* ---- top status bar ---- */
  #hud{
    padding:12px 14px 6px;
    display:flex;flex-direction:column;gap:8px;
    background:linear-gradient(#fff7ef,#fdeee0);
    z-index:5;
  }
  #titlebar{display:flex;align-items:center;justify-content:space-between;}
  #petname{font-weight:700;font-size:17px;letter-spacing:.3px;}
  #mood{font-size:13px;font-weight:600;padding:3px 10px;border-radius:20px;background:#fff;box-shadow:0 1px 3px var(--shadow);}
  .meters{display:flex;flex-direction:column;gap:6px;}
  .meter{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;}
  .meter .lbl{width:74px;display:flex;align-items:center;gap:4px;}
  .bar{flex:1;height:12px;border-radius:8px;background:#e9dccd;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.08);}
  .fill{height:100%;width:50%;border-radius:8px;transition:width .35s ease, background-color .35s ease;}
  /* ---- stage / canvas ---- */
  #stagewrap{position:relative;flex:1;min-height:0;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
  /* floating bubbles / hearts */
  .fx{position:absolute;pointer-events:none;font-size:26px;transform:translate(-50%,-50%);
      animation:floatUp 1.3s ease-out forwards;z-index:6;filter:drop-shadow(0 2px 2px rgba(0,0,0,.15));}
  @keyframes floatUp{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.4);}
    20%{opacity:1;transform:translate(-50%,-90%) scale(1.15);}
    100%{opacity:0;transform:translate(-50%,-220%) scale(1);}
  }
  .vomit{position:absolute;pointer-events:none;font-size:20px;z-index:6;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.2));}
  .vomit-pool{position:absolute;pointer-events:none;font-size:16px;z-index:5;
    opacity:0;animation:poolFade 3s ease-out forwards;}
  @keyframes poolFade{
    0%{opacity:0;transform:scale(.5);}
    15%{opacity:1;transform:scale(1);}
    75%{opacity:1;}
    100%{opacity:0;transform:scale(.8);}
  }
  #speech{
    position:absolute;left:0;top:0;transform:translate(-50%,-100%);
    background:#fff;color:var(--ink);padding:8px 14px;border-radius:16px;
    font-size:14px;font-weight:600;box-shadow:0 4px 12px var(--shadow);
    opacity:0;transition:opacity .25s;max-width:80%;text-align:center;z-index:7;
    white-space:nowrap;pointer-events:none;
  }
  #speech.show{opacity:1;}
  #speech:after{content:"";position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);
    border:8px solid transparent;border-top-color:#fff;border-bottom:0;}
  /* ---- action buttons ---- */
  #actions{
    display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
    padding:12px 14px 16px;background:linear-gradient(#fdeee0,#fbe6d4);z-index:5;
  }
  .btn{
    border:0;border-radius:16px;padding:12px 6px 10px;cursor:pointer;
    background:#fff;box-shadow:0 3px 0 var(--shadow),0 5px 12px rgba(0,0,0,.06);
    display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:12px;font-weight:700;color:var(--ink);
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .btn .ic{font-size:26px;line-height:1;}
  .btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--shadow),0 2px 6px rgba(0,0,0,.08);}
  .btn:disabled{opacity:.5;cursor:default;}
  /* birthday sparkle banner */
  #banner{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:14px;background:rgba(42,33,28,.78);color:#fff;z-index:20;
    text-align:center;padding:24px;backdrop-filter:blur(3px);
  }
  #banner h1{margin:0;font-size:30px;line-height:1.2;}
  #banner p{margin:0;opacity:.9;font-size:15px;max-width:320px;}
  #banner button{
    margin-top:8px;border:0;border-radius:30px;padding:14px 30px;font-size:16px;font-weight:800;
    background:var(--accent);color:#fff;cursor:pointer;box-shadow:0 6px 20px rgba(224,122,139,.5);
  }
  #banner.hide{display:none;}
</style>
</head>
<body>
<div id="game">
  <div id="hud">
    <div id="titlebar">
      <span id="petname">Loading…</span>
      <span id="mood">🙂 okay</span>
    </div>
    <div class="meters">
      <div class="meter"><span class="lbl">🍪 Hunger</span><div class="bar"><div class="fill" id="f-hunger"></div></div></div>
      <div class="meter"><span class="lbl">🎨 Fun</span><div class="bar"><div class="fill" id="f-fun"></div></div></div>
      <div class="meter"><span class="lbl">💗 Love</span><div class="bar"><div class="fill" id="f-love"></div></div></div>
    </div>
  </div>

  <div id="stagewrap">
    <canvas id="cv"></canvas>
    <div id="speech"></div>
  </div>

  <div id="actions">
    <button class="btn" data-action="feed"><span class="ic">🍪</span>Cookie</button>
    <button class="btn" data-action="draw"><span class="ic">🎨</span>Draw</button>
    <button class="btn" data-action="hug"><span class="ic">🤗</span>Hug</button>
  </div>

  <div id="banner">
    <h1>Happy Birthday! 🎂</h1>
    <p>I made you a little you. Feed her cookies, draw together, and give her hugs. Take care of her today. 💛</p>
    <button id="startBtn">Say hi 👋</button>
  </div>
</div>

<script>
/* ============================================================================
   BIRTHDAY VIRTUAL PET  —  engine
   ----------------------------------------------------------------------------
   Everything you'll want to change lives in CONFIG below.
   The art comes from the sprite sheets defined in the SHEETS block below.
   A placeholder character shows only during the brief moment the art loads.
   ============================================================================ */

const CONFIG = {
  name: "My Love",              // <-- put her name here

  // How fast needs drain (points lost per real-time second). Lower = more relaxed.
  decay: { hunger: 0.35, fun: 0.30, love: 0.25 },

  // How much each action gives back (0-100 scale)
  gains: { feed: 34, draw: 30, hug: 40 },

  // Movement
  walkSpeed: 42,                // pixels per second (in the canvas's internal coords)
  idleWanderEvery: [2.5, 6.0],  // she picks a new spot every N seconds (random in range)

  // Persist progress between visits
  save: true,
};

/* ----------------------------------------------------------------------------
   SPRITE SHEETS  (all sheets have transparent backgrounds)
   ----------------------------------------------------------------------------
   Each sheet is a grid of frames laid out cols x rows.
     cols       frames across (the animation frames)
     rows       rows down. For `walk` each row is a facing direction.
     fps        playback speed
     displayH   on-screen height in canvas px (feet pinned to the floor)
     footInset  fraction of empty space below her feet; she is shifted down by
                this much so her feet rest on the floor (raise if she floats)
     rowMap     (walk only) which row holds which facing direction
   To add/replace a sheet later, just edit the entry (src / cols / rows / fps).
   ---------------------------------------------------------------------------- */
const SHEETS = {
  walk: { src:"k-walking3.png", cols:4, rows:4, fps:8, displayH:150, footInset:0.07,
          rowMap:{ down:0, left:1, right:2, up:3 } },
  eat:  { src:"k-eating.png",   cols:4, rows:1, fps:7, displayH:158, footInset:0.11 },
  draw: { src:"k-drawing.png",  cols:4, rows:1, fps:6, displayH:158, footInset:0.00 },
  cry:  { src:"k-crying.png",   cols:4, rows:1, fps:5, displayH:158, footInset:0.11 },
};

/* Things she "says" — pulled at random per action/mood. Personalize freely. */
const LINES = {
  feed:  ["Cookies! 🍪", "Mmm, thank you!", "My favorite 😋", "One more?"],
  feedFull: ["I'm pretty full…", "Maybe no more cookies…", "My tummy hurts a little 🤢"],
  throwup: ["🤢 I don't feel so good…", "Too many cookies… 🤮", "I told you I was full! 😣"],
  draw:  ["Let's draw! 🎨", "I love this ✏️", "Look what I made!", "So fun 🌈"],
  drawHungry: ["Drawing makes me hungry…", "I need a snack break 🍪", "My tummy's growling…"],
  hug:   ["Aww 🥰", "I feel safe.", "Hold me longer 💗", "You're the best."],
  happy: ["I'm so happy!", "Best day ever 💛", "I love you!"],
  sad:   ["I'm a little lonely…", "Play with me?", "Hungry…", "Come back 🥺"],
  hungry:["I could go for a cookie…"],
  bored: ["I'm bored 😪"],
  needlove:["Need a hug 🥺"],
};

/* ==========================  ENGINE  (edit below with care)  ============== */

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const stagewrap = document.getElementById('stagewrap');

// Internal resolution the game logic uses; canvas scales to fit its box.
const W = 360, H = 420;

/* ---------- sprite loading ----------
   Load each sheet, colour-key its background if asked, and stash a ready-to-blit
   canvas + per-frame dimensions. `sheets[key]` mirrors SHEETS[key] plus runtime. */
const sheets = {};
function loadSheet(key, cfg){
  const rec = { cfg, ready:false, canvas:null, fw:0, fh:0 };
  sheets[key] = rec;
  const img = new Image();
  img.onload = ()=>{
    const fw = Math.floor(img.width  / cfg.cols);
    const fh = Math.floor(img.height / cfg.rows);
    rec.canvas = img; rec.fw = fw; rec.fh = fh; rec.ready = true;
  };
  img.src = cfg.src;
}
for (const key in SHEETS) loadSheet(key, SHEETS[key]);

/* ---------- game state ---------- */
const DEFAULT_STATE = {
  hunger: 70, fun: 70, love: 70,
  overfed: 0, overdraw: 0,
  x: W/2, y: H*0.68,
  lastSeen: null,
};
let state = load();

// visual / animation runtime (not persisted)
const pet = {
  x: state.x, y: state.y,
  tx: state.x, ty: state.y,     // target position she walks toward
  dir: 'down',                  // 'down' | 'left' | 'right' | 'up'
  moving: false,
  action: null,                 // 'eat' | 'draw' | 'hug' while a scripted action plays
  animLock: 0,                  // seconds remaining that lock a scripted action
  frame: 0, frameTime: 0,
  wanderTimer: 1.5,
  bob: 0,
};

/* ---------- save / load ---------- */
function load(){
  if (CONFIG.save){
    try{
      const raw = localStorage.getItem('bpet');
      if (raw){
        const s = {...DEFAULT_STATE, ...JSON.parse(raw)};
        applyAwayDecay(s);
        return s;
      }
    }catch(e){}
  }
  return {...DEFAULT_STATE};
}
function save(){
  if (!CONFIG.save) return;
  state.x = pet.x; state.y = pet.y; state.lastSeen = Date.now();
  try{ localStorage.setItem('bpet', JSON.stringify(state)); }catch(e){}
}
// While the tab was closed, needs drift down (gently, capped).
function applyAwayDecay(s){
  if (!s.lastSeen) return;
  const secs = Math.min((Date.now()-s.lastSeen)/1000, 60*60*8); // cap at 8h
  s.hunger = clamp(s.hunger - CONFIG.decay.hunger*secs*0.4);
  s.fun    = clamp(s.fun    - CONFIG.decay.fun*secs*0.4);
  s.love   = clamp(s.love   - CONFIG.decay.love*secs*0.4);
}

/* ---------- helpers ---------- */
function clamp(v){ return Math.max(0, Math.min(100, v)); }
function rand(a,b){ return a + Math.random()*(b-a); }
function pick(arr){ return arr[(Math.random()*arr.length)|0]; }

/* ---------- mood ---------- */
function moodScore(){ return (state.hunger + state.fun + state.love)/3; }
function moodInfo(){
  const m = moodScore();
  if (m > 75) return {emoji:'😄', label:'delighted', key:'happy'};
  if (m > 55) return {emoji:'🙂', label:'happy',     key:'idle'};
  if (m > 35) return {emoji:'😐', label:'okay',      key:'idle'};
  if (m > 18) return {emoji:'🙁', label:'grumpy',    key:'sad'};
  return           {emoji:'😢', label:'sad',       key:'sad'};
}

/* ---------- crying ----------
   She cries when everything is neglected (all three stats below 15%).
   The "c" debug key force-toggles it on/off regardless of stats. */
let debugCry = false;
function isCrying(){
  return debugCry || (state.hunger < 15 && state.fun < 15 && state.love < 15);
}

/* ---------- actions ---------- */
let cooldown = 0;
function doAction(kind){
  if (cooldown > 0) return;
  cooldown = 0.6;

  if (kind === 'feed'){
    const wouldOverfeed = state.hunger + CONFIG.gains.feed > 100;
    state.hunger = clamp(state.hunger + CONFIG.gains.feed);
    if (wouldOverfeed) {
      state.overfed += CONFIG.gains.feed;
      if (state.overfed >= 70) {
        state.hunger = state.hunger * 0.5;
        state.fun = state.fun * 0.5;
        state.love = state.love * 0.5;
        state.overfed = 0;
        playAnim('eat', 2.0, 2); say(pick(LINES.throwup)); throwUpFx();
      } else {
        playAnim('eat', 1.6); say(pick(LINES.feedFull)); burst('🍪');
      }
    } else {
      state.overfed = 0;
      playAnim('eat', 1.6); say(pick(LINES.feed)); burst('🍪');
    }
  }
  if (kind === 'draw'){
    const wouldOverdraw = state.fun + CONFIG.gains.draw > 100;
    state.fun = clamp(state.fun + CONFIG.gains.draw);
    state.love = clamp(state.love+6);
    if (wouldOverdraw) {
      state.overdraw += CONFIG.gains.draw;
      state.hunger = clamp(state.hunger - state.overdraw * 0.3);
      playAnim('draw',1.8); say(pick(LINES.drawHungry)); burst('🎨');
    } else {
      state.overdraw = 0;
      playAnim('draw',1.8); say(pick(LINES.draw)); burst('🎨'); burst('🌈');
    }
  }
  if (kind === 'hug' ){ state.love = clamp(state.love + CONFIG.gains.hug); state.fun = clamp(state.fun+8); playAnim('hug', 1.4); say(pick(LINES.hug)); hearts(); }
  pet.wanderTimer = 0.4;   // resume wandering shortly after the action

  refreshHUD();
  save();
}
document.querySelectorAll('.btn[data-action]').forEach(b=>{
  b.addEventListener('click', ()=> doAction(b.dataset.action));
});
// Tap the pet for a hug too.
stagewrap.addEventListener('pointerdown', (e)=>{
  const r = cv.getBoundingClientRect();
  const px = (e.clientX - r.left) / r.width * W;
  const py = (e.clientY - r.top)  / r.height * H;
  // sprite occupies roughly a box above the feet point (pet.x, pet.y)
  const h = SHEETS.walk.displayH;
  const halfW = h * 0.32;
  if (px > pet.x-halfW && px < pet.x+halfW && py > pet.y-h && py < pet.y+12) doAction('hug');
});

/* ---------- scripted animation ---------- */
function playAnim(action, dur, lockFrame){
  pet.action = action; pet.animLock = dur; pet.frame = lockFrame ?? 0; pet.frameTime = 0;
  pet.frameLock = lockFrame ?? null;
  pet.dir = 'down';                    // face the player during an action
}

/* ---------- speech + fx ---------- */
const speech = document.getElementById('speech');
let speechTimer = null;
function say(text){
  speech.textContent = text; speech.classList.add('show');
  positionSpeech();
  clearTimeout(speechTimer);
  speechTimer = setTimeout(()=> speech.classList.remove('show'), 1800);
}
function positionSpeech(){
  const r = cv.getBoundingClientRect();
  const wrapR = stagewrap.getBoundingClientRect();
  const sh = SHEETS.walk;
  const dispH = sh ? sh.displayH || 150 : 150;
  const sx = (pet.x / W) * r.width + (r.left - wrapR.left);
  const sy = ((pet.y - dispH - 10) / H) * r.height + (r.top - wrapR.top);
  speech.style.left = sx + 'px';
  speech.style.top = sy + 'px';
}
function fxAt(px, py, chars){
  const r = cv.getBoundingClientRect();
  const wrapR = stagewrap.getBoundingClientRect();
  const sx = (px/W)*r.width  + (r.left - wrapR.left);
  const sy = (py/H)*r.height + (r.top  - wrapR.top);
  const el = document.createElement('div');
  el.className = 'fx'; el.textContent = chars;
  el.style.left = sx+'px'; el.style.top = sy+'px';
  stagewrap.appendChild(el);
  setTimeout(()=> el.remove(), 1300);
}
function burst(ch){ for(let i=0;i<3;i++) setTimeout(()=> fxAt(pet.x + rand(-24,24), pet.y-30, ch), i*90); }
function hearts(){ for(let i=0;i<5;i++) setTimeout(()=> fxAt(pet.x + rand(-30,30), pet.y-30, pick(['💗','💛','💖'])), i*80); }

function throwUpFx(){
  const r = cv.getBoundingClientRect();
  const wrapR = stagewrap.getBoundingClientRect();
  const sh = SHEETS.walk;
  const dispH = sh ? sh.displayH || 150 : 150;

  // mouth position (roughly mid-face)
  const mouthY = pet.y - dispH * 0.55;
  // feet position (where cookies pool)
  const feetY = pet.y;

  const toScreenX = (px) => (px / W) * r.width + (r.left - wrapR.left);
  const toScreenY = (py) => (py / H) * r.height + (r.top - wrapR.top);

  const mouthSX = toScreenX(pet.x);
  const mouthSY = toScreenY(mouthY);
  const feetSY = toScreenY(feetY);
  const fallDist = feetSY - mouthSY;

  // Stream of cookies falling from mouth
  const numCookies = 8;
  for (let i = 0; i < numCookies; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'vomit';
      el.textContent = '🍪';
      const startX = mouthSX + rand(-8, 8);
      el.style.left = startX + 'px';
      el.style.top = mouthSY + 'px';
      stagewrap.appendChild(el);

      const xDrift = rand(-20, 20);
      const dur = rand(400, 600);
      el.animate([
        { top: mouthSY + 'px', left: startX + 'px', opacity: 1, transform: 'rotate(0deg) scale(1)' },
        { top: feetSY + 'px', left: (startX + xDrift) + 'px', opacity: 1, transform: 'rotate(' + rand(-180, 180) + 'deg) scale(0.7)' }
      ], { duration: dur, easing: 'ease-in', fill: 'forwards' });

      setTimeout(() => el.remove(), dur);

      // After each cookie lands, add it to the pool
      setTimeout(() => {
        const pool = document.createElement('div');
        pool.className = 'vomit-pool';
        pool.textContent = '🍪';
        pool.style.left = (startX + xDrift + rand(-6, 6)) + 'px';
        pool.style.top = (feetSY + rand(-4, 4)) + 'px';
        stagewrap.appendChild(pool);
        setTimeout(() => pool.remove(), 3000);
      }, dur);
    }, i * 120);
  }
}

/* ---------- HUD ---------- */
const fills = { hunger:document.getElementById('f-hunger'), fun:document.getElementById('f-fun'), love:document.getElementById('f-love') };
function barColor(v){ return v>55 ? 'var(--good)' : v>28 ? 'var(--warn)' : 'var(--bad)'; }
function refreshHUD(){
  for (const k of ['hunger','fun','love']){
    fills[k].style.width = state[k] + '%';
    fills[k].style.background = barColor(state[k]);
  }
  const mi = moodInfo();
  document.getElementById('mood').textContent = mi.emoji + ' ' + mi.label;
}
document.getElementById('petname').textContent = CONFIG.name;

/* ---------- nagging when a need gets low ---------- */
let nagTimer = 0;
function maybeNag(dt){
  nagTimer -= dt;
  if (nagTimer > 0) return;
  nagTimer = 9;
  if (state.hunger < 25){ say(pick(LINES.hungry)); }
  else if (state.love < 25){ say(pick(LINES.needlove)); }
  else if (state.fun < 25){ say(pick(LINES.bored)); }
}

/* ---------- main loop ---------- */
let last = 0, started = false;
function loop(ts){
  if (!last) last = ts;
  let dt = (ts - last)/1000; last = ts;
  if (dt > 0.1) dt = 0.1;            // clamp big gaps (tab switch)

  if (started){
    // needs decay
    state.hunger = clamp(state.hunger - CONFIG.decay.hunger*dt);
    state.fun    = clamp(state.fun    - CONFIG.decay.fun*dt);
    state.love   = clamp(state.love   - CONFIG.decay.love*dt);
    // Reset overfed/overdraw only when stats drop significantly below full
    if (state.hunger < 80) state.overfed = 0;
    if (state.fun < 80) state.overdraw = 0;
    if (cooldown>0) cooldown -= dt;
    maybeNag(dt);
    updatePet(dt);
    // refresh bars periodically (cheap)
    hudAccum += dt; if (hudAccum > 0.25){ refreshHUD(); hudAccum = 0; }
    saveAccum += dt; if (saveAccum > 5){ save(); saveAccum = 0; }
  }

  sceneTime += dt;
  updateWaves(dt);
  if (started) updateScene(dt);
  render();
  if (speech.classList.contains('show')) positionSpeech();
  requestAnimationFrame(loop);
}
let hudAccum = 0, saveAccum = 0;

function updatePet(dt){
  pet.bob += dt;

  // scripted action (eat/draw/hug) — stand facing forward and play the action art
  if (pet.animLock > 0){
    pet.animLock -= dt;
    pet.moving = false;
    const s = SHEETS[pet.action] || SHEETS.walk;   // eat/draw have their own sheets
    if (pet.frameLock === null) advanceFrame(dt, s.fps, s.cols);
    if (pet.animLock <= 0){ pet.action = null; pet.frame = 0; pet.frameTime = 0; pet.frameLock = null; }
    return;
  }

  // crying — everything neglected (all stats < 15%) or toggled with the "c" key.
  // She stands still and sobs until you cheer her up.
  if (isCrying() && sheets.cry && sheets.cry.ready){
    pet.moving = false;
    pet.dir = 'down';
    advanceFrame(dt, SHEETS.cry.fps, SHEETS.cry.cols);
    return;
  }

  // wander: pick a new spot on the floor now and then
  pet.wanderTimer -= dt;
  if (pet.wanderTimer <= 0){
    pet.tx = rand(W*0.18, W*0.82);
    pet.ty = rand(H*0.66, H*0.82);     // keep her feet on the floor
    pet.wanderTimer = rand(CONFIG.idleWanderEvery[0], CONFIG.idleWanderEvery[1]);
  }

  const dx = pet.tx - pet.x, dy = pet.ty - pet.y;
  const dist = Math.hypot(dx, dy);
  if (dist > 3){
    const step = CONFIG.walkSpeed * dt;
    pet.x += dx/dist * step;
    pet.y += dy/dist * step;
    // choose facing row from the dominant movement axis
    if (Math.abs(dx) > Math.abs(dy)) pet.dir = dx > 0 ? 'right' : 'left';
    else                             pet.dir = dy > 0 ? 'down'  : 'up';
    pet.moving = true;
    advanceFrame(dt, SHEETS.walk.fps, SHEETS.walk.cols);
  } else {
    pet.moving = false;                // idle: rest on the standing frame
    pet.frame = 0; pet.frameTime = 0;
  }
}

function advanceFrame(dt, fps, cols){
  pet.frameTime += dt;
  const spf = 1 / fps;
  while (pet.frameTime >= spf){ pet.frameTime -= spf; pet.frame = (pet.frame + 1) % cols; }
}

/* ==========================  RENDER  ====================================== */
function resize(){
  const r = stagewrap.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  cv.width = r.width*dpr; cv.height = r.height*dpr;
  ctx.setTransform(cv.width/W, 0, 0, cv.height/H, 0, 0);
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);

let sceneTime = 0;
const SCENES = ['beach', 'backyard', 'river'];
let currentScene = 0;
let sceneChangeTimer = 60; // seconds

// Debug: press 1/2/3 to switch scenes, c to toggle crying
document.addEventListener('keydown', e => {
  if (e.key === '1') { currentScene = 0; sceneChangeTimer = 60; }
  if (e.key === '2') { currentScene = 1; sceneChangeTimer = 60; }
  if (e.key === '3') { currentScene = 2; sceneChangeTimer = 60; }
  if (e.key === 'c' || e.key === 'C') {
    debugCry = !debugCry;
    say(debugCry ? '(debug: crying on)' : '(debug: crying off)');
  }
});

function updateScene(dt) {
  sceneChangeTimer -= dt;
  if (sceneChangeTimer <= 0) {
    currentScene = (currentScene + 1) % SCENES.length;
    sceneChangeTimer = 60;
  }
}

function render(){
  ctx.clearRect(0,0,W,H);
  if (SCENES[currentScene] === 'beach') drawBeach();
  else if (SCENES[currentScene] === 'backyard') drawBackyard();
  else if (SCENES[currentScene] === 'river') drawRiver();
  drawPet();
}

function drawBeach(){
  const t = sceneTime;

  // Sky gradient
  const sky = ctx.createLinearGradient(0, 0, 0, H * 0.45);
  sky.addColorStop(0, '#4a90d9');
  sky.addColorStop(0.5, '#87ceeb');
  sky.addColorStop(1, '#b5e0f5');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H * 0.45);

  // Sun
  const sunX = W * 0.82, sunY = H * 0.10;
  ctx.fillStyle = '#fff4b0';
  ctx.beginPath(); ctx.arc(sunX, sunY, 28, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,244,176,.3)';
  ctx.beginPath(); ctx.arc(sunX, sunY, 42, 0, 7); ctx.fill();

  // Clouds
  drawCloud(W * 0.15 + Math.sin(t * 0.15) * 8, H * 0.08, 0.9);
  drawCloud(W * 0.55 + Math.sin(t * 0.1 + 2) * 10, H * 0.14, 0.7);
  drawCloud(W * 0.85 + Math.sin(t * 0.12 + 4) * 6, H * 0.06, 0.5);

  // Ocean
  const oceanTop = H * 0.38;
  const oceanBot = H * 0.62;
  const ocean = ctx.createLinearGradient(0, oceanTop, 0, oceanBot);
  ocean.addColorStop(0, '#2e8bc0');
  ocean.addColorStop(0.4, '#1a6fa0');
  ocean.addColorStop(1, '#3aa5c8');
  ctx.fillStyle = ocean;
  ctx.fillRect(0, oceanTop, W, oceanBot - oceanTop);

  // Open ocean swells (far out, gentle)
  drawSwell(oceanTop + 4, t, 1.4, 6, 0.025, '#2080a8');
  drawSwell(oceanTop + 12, t, 1.0, 4, 0.035, '#2590b8');

  // Wet sand strip (fixed, small)
  const wetSand = ctx.createLinearGradient(0, oceanBot - 4, 0, oceanBot + 12);
  wetSand.addColorStop(0, '#a8905a');
  wetSand.addColorStop(1, '#c4a86a');
  ctx.fillStyle = wetSand;
  ctx.fillRect(0, oceanBot - 4, W, 16);

  // Dry sand (drawn BEFORE waves so waves lap over it)
  const sand = ctx.createLinearGradient(0, oceanBot + 8, 0, H);
  sand.addColorStop(0, '#dcc08a');
  sand.addColorStop(0.3, '#f0d9a0');
  sand.addColorStop(1, '#dfc07a');
  ctx.fillStyle = sand;
  ctx.fillRect(0, oceanBot + 8, W, H - oceanBot - 8);

  // Breaking waves drawn ON TOP of sand so wash laps over it
  for (const wave of waves) drawBreakingWave(wave, oceanTop, oceanBot);

  // Sand texture — little dots
  ctx.fillStyle = 'rgba(180,150,90,0.3)';
  for (let i = 0; i < 40; i++) {
    const sx = ((i * 73 + 17) % W);
    const sy = oceanBot + 14 + ((i * 47 + 31) % (H * 0.34));
    ctx.fillRect(sx, sy, 1.5, 1.5);
  }

  // Beach towel
  ctx.fillStyle = 'rgba(224,122,139,0.4)';
  ctx.save();
  ctx.translate(W * 0.75, H * 0.78);
  ctx.rotate(-0.15);
  roundRect(-30, -12, 60, 24, 3); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.fillRect(-30, -4, 60, 3);
  ctx.fillRect(-30, 4, 60, 3);
  ctx.restore();

  // Cookie plate on the sand
  const px = W * 0.20, py = H * 0.82;
  ctx.fillStyle = '#e9e2d6'; ctx.beginPath(); ctx.ellipse(px, py, 26, 9, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#c98a4b'; ctx.beginPath(); ctx.arc(px - 6, py - 3, 7, 0, 7); ctx.arc(px + 7, py - 2, 7, 0, 7); ctx.fill();
  ctx.fillStyle = '#5a3b22';
  ctx.fillRect(px - 8, py - 4, 1.6, 1.6); ctx.fillRect(px - 3, py - 6, 1.6, 1.6); ctx.fillRect(px + 8, py - 3, 1.6, 1.6);

  // Sand castle
  const cx = W * 0.88, cy = H * 0.86;
  ctx.fillStyle = '#d4b06a';
  ctx.fillRect(cx - 12, cy - 16, 24, 16);
  ctx.fillRect(cx - 16, cy - 10, 32, 10);
  ctx.fillRect(cx - 6, cy - 24, 12, 10);
  // flag
  ctx.strokeStyle = '#8a5a3a'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(cx, cy - 24); ctx.lineTo(cx, cy - 36); ctx.stroke();
  ctx.fillStyle = '#e07a8b';
  ctx.beginPath(); ctx.moveTo(cx, cy - 36); ctx.lineTo(cx + 10, cy - 32); ctx.lineTo(cx, cy - 28); ctx.fill();
}

function drawCloud(cx, cy, scale) {
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath();
  ctx.arc(cx, cy, 16 * scale, 0, 7);
  ctx.arc(cx + 14 * scale, cy - 6 * scale, 12 * scale, 0, 7);
  ctx.arc(cx + 24 * scale, cy, 14 * scale, 0, 7);
  ctx.arc(cx - 12 * scale, cy + 2 * scale, 10 * scale, 0, 7);
  ctx.fill();
}

// Gentle open-ocean swells
function drawSwell(baseY, t, speed, amp, freq, color) {
  // Ocean swells heave vertically — surface rises and falls in place
  const heave = Math.sin(t * speed) * amp;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, baseY + amp);
  for (let x = 0; x <= W; x += 4) {
    const shape = Math.sin(x * freq) * amp * 0.4
      + Math.sin(x * freq * 2.1 + 1.5) * amp * 0.2;
    ctx.lineTo(x, baseY + heave + shape);
  }
  ctx.lineTo(W, baseY + amp + 6);
  ctx.lineTo(0, baseY + amp + 6);
  ctx.closePath();
  ctx.fill();
}

/* ── Breaking wave system ──
   Each wave goes through a lifecycle:
   0. approach  — swell moves toward shore, growing taller
   1. crest     — wave peaks and curls over
   2. break     — crashes down, splash spray
   3. wash      — white foam rushes up the beach
   4. recede    — foam thins, pulls back, fades away
*/
const waves = [];
const WAVE_COUNT = 5;
const WAVE_CYCLE = 9; // seconds per full wave lifecycle (slow animation)

// Stagger waves closely so they emerge often but animate slowly
for (let i = 0; i < WAVE_COUNT; i++) {
  waves.push({
    phase: (i / WAVE_COUNT) * WAVE_CYCLE,
    seed: Math.random() * 100,
    amplitude: 0.8 + Math.random() * 0.4,
  });
}

function updateWaves(dt) {
  for (const w of waves) {
    w.phase = (w.phase + dt) % WAVE_CYCLE;
  }
}


function drawBreakingWave(wave, oceanTop, oceanBot) {
  const p = wave.phase / WAVE_CYCLE; // 0-1 normalized phase
  const amp = wave.amplitude;
  const seed = wave.seed;
  const shoreY = oceanBot;

  if (p < 0.35) {
    // ── APPROACH & CREST ──
    // Wave builds from back of ocean toward shore
    const approachP = p / 0.35;
    const waveY = oceanTop + (shoreY - oceanTop) * (0.3 + approachP * 0.65);
    const height = (6 + approachP * 16) * amp;
    const width = W * 1.6;

    // Wave body (dark water mound)
    const bodyGrad = ctx.createLinearGradient(0, waveY - height, 0, waveY + 4);
    bodyGrad.addColorStop(0, `rgba(30,100,160,${0.2 + approachP * 0.5})`);
    bodyGrad.addColorStop(1, `rgba(40,130,180,${0.1 + approachP * 0.3})`);
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.moveTo(0, waveY + 4);
    for (let x = 0; x <= W; x += 3) {
      const shape = Math.sin((x / width) * Math.PI + seed) *
        Math.sin((x / width) * Math.PI); // bell curve envelope
      const ripple = Math.sin(x * 0.08 + seed * 3) * 2 * approachP;
      ctx.lineTo(x, waveY - shape * height + ripple);
    }
    ctx.lineTo(W, waveY + 4);
    ctx.closePath();
    ctx.fill();

    // Crest foam (white cap forming at the top as wave steepens)
    if (approachP > 0.6) {
      const foamAlpha = (approachP - 0.6) / 0.4;
      ctx.fillStyle = `rgba(255,255,255,${foamAlpha * 0.7})`;
      ctx.beginPath();
      for (let x = 0; x <= W; x += 3) {
        const shape = Math.sin((x / width) * Math.PI + seed) *
          Math.sin((x / width) * Math.PI);
        if (shape > 0.4) {
          const fx = x;
          const fy = waveY - shape * height - 1;
          ctx.moveTo(fx, fy);
          ctx.arc(fx, fy, 3 * foamAlpha * amp, 0, 7);
        }
      }
      ctx.fill();

      // Curling lip — the top pitches forward
      if (approachP > 0.8) {
        const curlP = (approachP - 0.8) / 0.2;
        ctx.fillStyle = `rgba(200,235,255,${curlP * 0.6})`;
        ctx.beginPath();
        for (let x = W * 0.1; x <= W * 0.9; x += 4) {
          const shape = Math.sin((x / width) * Math.PI + seed) *
            Math.sin((x / width) * Math.PI);
          if (shape > 0.5) {
            const fy = waveY - shape * height;
            // Lip curls forward (downward)
            ctx.moveTo(x, fy);
            ctx.quadraticCurveTo(x + 4 * curlP, fy + 6 * curlP * amp, x + 2, fy + 10 * curlP * amp);
          }
        }
        ctx.stroke();
        ctx.fill();
      }
    }

  } else if (p < 0.45) {
    // ── BREAK / CRASH ──
    // The wave crashes down — big white splash
    const breakP = (p - 0.35) / 0.1;
    const crashY = shoreY - 6;
    const spread = (10 + breakP * 30) * amp;

    // Splash — white burst spreading outward
    ctx.fillStyle = `rgba(255,255,255,${0.8 - breakP * 0.3})`;
    ctx.beginPath();
    for (let x = 0; x <= W; x += 5) {
      const envl = Math.sin((x / W) * Math.PI);
      const splash = envl * spread * (1 + Math.sin(x * 0.15 + seed) * 0.3);
      if (envl > 0.2) {
        ctx.moveTo(x, crashY);
        ctx.arc(x, crashY - splash * 0.3, 4 + splash * 0.15, 0, 7);
      }
    }
    ctx.fill();

    // Spray droplets above the crash
    ctx.fillStyle = `rgba(255,255,255,${0.6 - breakP * 0.4})`;
    for (let i = 0; i < 12; i++) {
      const dx = Math.sin(seed * (i + 1) * 7.3) * W * 0.4 + W * 0.5;
      const dy = crashY - spread * 0.5 - Math.abs(Math.sin(seed * i * 3.1)) * 20 * (1 - breakP);
      const r = (1 + Math.sin(seed * i) * 0.5) * (1 - breakP * 0.5);
      ctx.beginPath(); ctx.arc(dx, dy, r, 0, 7); ctx.fill();
    }

    // Turbulent foam at water level
    ctx.fillStyle = `rgba(220,240,255,${0.7 - breakP * 0.2})`;
    ctx.beginPath();
    ctx.moveTo(0, crashY + 2);
    for (let x = 0; x <= W; x += 3) {
      const turb = Math.sin(x * 0.12 + seed) * 5 * (1 - breakP * 0.3);
      ctx.lineTo(x, crashY + turb);
    }
    ctx.lineTo(W, crashY + 8);
    ctx.lineTo(0, crashY + 8);
    ctx.closePath();
    ctx.fill();

  } else if (p < 0.7) {
    // ── WASH (swash) ──
    // White foam rushes up the beach, lapping over the sand
    const washP = (p - 0.45) / 0.25;
    const startY = shoreY - 2;
    const maxReach = H * 0.18 * amp;
    const reachY = startY + maxReach * washP;
    const alpha = 0.8 - washP * 0.3;

    // Thin water film over sand (translucent blue-green)
    const waterGrad = ctx.createLinearGradient(0, startY, 0, reachY + 4);
    waterGrad.addColorStop(0, `rgba(80,170,210,${alpha * 0.35})`);
    waterGrad.addColorStop(0.6, `rgba(120,195,225,${alpha * 0.2})`);
    waterGrad.addColorStop(1, `rgba(180,220,240,${alpha * 0.08})`);
    ctx.fillStyle = waterGrad;
    ctx.beginPath();
    ctx.moveTo(0, startY);
    for (let x = 0; x <= W; x += 3) {
      const edge = reachY + Math.sin(x * 0.06 + seed) * 5;
      ctx.lineTo(x, edge);
    }
    ctx.lineTo(W, startY);
    ctx.closePath();
    ctx.fill();

    // Thick white foam band at the leading edge
    const foamWidth = 8 + (1 - washP) * 10;
    const foamGrad = ctx.createLinearGradient(0, reachY - foamWidth, 0, reachY + 3);
    foamGrad.addColorStop(0, `rgba(255,255,255,${alpha * 0.1})`);
    foamGrad.addColorStop(0.4, `rgba(255,255,255,${alpha * 0.7})`);
    foamGrad.addColorStop(0.8, `rgba(255,255,255,${alpha * 0.9})`);
    foamGrad.addColorStop(1, `rgba(240,250,255,${alpha * 0.4})`);
    ctx.fillStyle = foamGrad;
    ctx.beginPath();
    ctx.moveTo(0, reachY - foamWidth);
    for (let x = 0; x <= W; x += 3) {
      const edge = reachY + Math.sin(x * 0.06 + seed) * 5;
      ctx.lineTo(x, edge);
    }
    ctx.lineTo(W, reachY - foamWidth);
    ctx.closePath();
    ctx.fill();

    // Foam texture — bubbly circles in the foam band
    ctx.fillStyle = `rgba(255,255,255,${alpha * 0.6})`;
    for (let i = 0; i < 25; i++) {
      const bx = (Math.sin(seed * (i + 1) * 5.7) * 0.5 + 0.5) * W;
      const by = reachY - foamWidth * (Math.sin(seed * i * 2.3) * 0.5 + 0.5);
      const br = 1.2 + Math.sin(seed * i * 3.1) * 1.0;
      ctx.beginPath(); ctx.arc(bx, by, br, 0, 7); ctx.fill();
    }

    // Splash particles — tiny droplets kicked up ahead of the foam
    if (washP < 0.7) {
      ctx.fillStyle = `rgba(255,255,255,${(0.7 - washP) * 0.8})`;
      for (let i = 0; i < 12; i++) {
        const sx = (Math.sin(seed * (i + 3) * 7.1) * 0.5 + 0.5) * W;
        const ahead = reachY + 4 + Math.abs(Math.sin(seed * i * 4.7)) * 14;
        const sy = ahead - Math.abs(Math.sin(seed * i * 2.9 + washP * 4)) * 10;
        const sr = 0.8 + Math.sin(seed * i) * 0.5;
        ctx.beginPath(); ctx.arc(sx, sy, sr, 0, 7); ctx.fill();
      }
    }

  } else {
    // ── RECEDE (backwash) ──
    // Water pulls back toward ocean, thinning and fading
    const recedeP = (p - 0.7) / 0.3;
    const maxReachY = shoreY + H * 0.18 * amp;
    const currentEdge = maxReachY - (maxReachY - shoreY + 4) * recedeP;
    const alpha = 0.3 * (1 - recedeP);

    if (alpha > 0.01) {
      // Thin receding film of water
      const filmGrad = ctx.createLinearGradient(0, shoreY - 4, 0, currentEdge);
      filmGrad.addColorStop(0, `rgba(160,210,230,${alpha * 0.3})`);
      filmGrad.addColorStop(1, `rgba(255,255,255,${alpha})`);
      ctx.fillStyle = filmGrad;
      ctx.beginPath();
      ctx.moveTo(0, shoreY - 4);
      for (let x = 0; x <= W; x += 4) {
        const edge = currentEdge + Math.sin(x * 0.05 + seed) * 2 * (1 - recedeP);
        ctx.lineTo(x, edge);
      }
      ctx.lineTo(W, shoreY - 4);
      ctx.closePath();
      ctx.fill();

      // Scattered remaining foam
      ctx.fillStyle = `rgba(255,255,255,${alpha * 0.6})`;
      for (let i = 0; i < 8; i++) {
        const bx = (Math.sin(seed * (i + 1) * 4.1) * 0.5 + 0.5) * W;
        const by = shoreY + (currentEdge - shoreY) * Math.abs(Math.sin(seed * i * 1.7));
        if (by < currentEdge) {
          ctx.beginPath(); ctx.arc(bx, by, 1 + (1 - recedeP), 0, 7); ctx.fill();
        }
      }
    }
  }
}

/* ══════════════════════ BACKYARD SCENE ══════════════════════ */

// Backyard critters — birds and squirrels visit the feeders
const critters = [];
let critterTimer = 0;
function updateCritters(dt) {
  critterTimer -= dt;
  if (critterTimer <= 0 && critters.length < 6) {
    critterTimer = rand(1.5, 4);
    const type = Math.random() < 0.7 ? 'bird' : 'squirrel';
    const isLeft = Math.random() < 0.5;
    const feederX = isLeft ? W * 0.28 : W * 0.72;
    const feederY = isLeft ? H * 0.55 : H * 0.52;
    critters.push({
      type,
      x: type === 'bird' ? rand(-20, W + 20) : (Math.random() < 0.5 ? -20 : W + 20),
      y: type === 'bird' ? rand(H * 0.15, H * 0.3) : H * 0.86,
      tx: feederX + rand(-10, 10),
      ty: type === 'bird' ? feederY - 6 + rand(-3, 3) : feederY + 6,
      poleBaseX: feederX,
      poleBaseY: feederY + H * 0.3,
      feederTopY: feederY - 4,
      phase: type === 'squirrel' ? 'approach' : null,
      atFeeder: false,
      feedTime: 0,
      maxFeed: rand(3, 7),
      leaving: false,
      leaveX: Math.random() < 0.5 ? -30 : W + 30,
      leaveY: type === 'bird' ? rand(H * 0.1, H * 0.25) : H * 0.86,
      bob: rand(0, 6),
      color: type === 'bird' ? pick(['#e04040','#4080e0','#e0a020','#40b040','#8040c0']) : '#8B6914',
    });
  }
  for (let i = critters.length - 1; i >= 0; i--) {
    const c = critters[i];
    c.bob += dt;

    if (c.type === 'bird') {
      const speed = 80;
      if (!c.atFeeder && !c.leaving) {
        const dx = c.tx - c.x, dy = c.ty - c.y;
        const d = Math.hypot(dx, dy);
        if (d > 2) { c.x += dx/d * speed * dt; c.y += dy/d * speed * dt; }
        else { c.atFeeder = true; }
      } else if (c.atFeeder) {
        c.feedTime += dt;
        if (c.feedTime >= c.maxFeed) { c.leaving = true; c.atFeeder = false; }
      } else {
        const dx = c.leaveX - c.x, dy = c.leaveY - c.y;
        const d = Math.hypot(dx, dy);
        if (d > 2) { c.x += dx/d * speed * 1.3 * dt; c.y += dy/d * speed * 1.3 * dt; }
        else { critters.splice(i, 1); }
      }
    } else {
      // Squirrel: approach pole → climb up → eat → climb down → scamper away
      const runSpeed = 60;
      const climbSpeed = 45;
      if (c.phase === 'approach') {
        // Run along ground to pole base
        const dx = c.poleBaseX - c.x;
        if (Math.abs(dx) > 3) { c.x += Math.sign(dx) * runSpeed * dt; }
        else { c.x = c.poleBaseX; c.phase = 'climb'; }
      } else if (c.phase === 'climb') {
        // Climb straight up the pole
        if (c.y > c.feederTopY + 3) { c.y -= climbSpeed * dt; }
        else { c.y = c.feederTopY; c.phase = 'eat'; c.atFeeder = true; }
      } else if (c.phase === 'eat') {
        c.feedTime += dt;
        if (c.feedTime >= c.maxFeed) { c.phase = 'descend'; c.atFeeder = false; }
      } else if (c.phase === 'descend') {
        // Climb back down
        if (c.y < c.poleBaseY - 3) { c.y += climbSpeed * dt; }
        else { c.y = H * 0.86; c.phase = 'leave'; }
      } else if (c.phase === 'leave') {
        const dx = c.leaveX - c.x;
        if (Math.abs(dx) > 3) { c.x += Math.sign(dx) * runSpeed * 1.3 * dt; }
        else { critters.splice(i, 1); }
      }
    }
  }
}

function drawBackyard() {
  const t = sceneTime;

  // Sky
  const sky = ctx.createLinearGradient(0, 0, 0, H * 0.5);
  sky.addColorStop(0, '#6aafe6');
  sky.addColorStop(1, '#b8ddf5');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H * 0.5);

  // Clouds
  drawCloud(W * 0.2 + Math.sin(t * 0.1) * 6, H * 0.08, 0.8);
  drawCloud(W * 0.65 + Math.sin(t * 0.07 + 3) * 8, H * 0.12, 0.6);

  // Houses behind fence — wide, half hidden by fence, cropped off screen edges
  // Left house (extends off left edge)
  const lhx = -30, lhy = H * 0.14;
  ctx.fillStyle = '#c4a882'; ctx.fillRect(lhx, lhy, 160, 100);
  ctx.fillStyle = '#a0522d'; // roof
  ctx.beginPath(); ctx.moveTo(lhx - 8, lhy); ctx.lineTo(lhx + 80, lhy - 50);
  ctx.lineTo(lhx + 168, lhy); ctx.closePath(); ctx.fill();
  // second story windows
  ctx.fillStyle = '#6a9fd8';
  ctx.fillRect(lhx + 20, lhy + 12, 22, 20); ctx.fillRect(lhx + 60, lhy + 12, 22, 20);
  ctx.fillRect(lhx + 100, lhy + 12, 22, 20);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
  ctx.strokeRect(lhx + 20, lhy + 12, 22, 20); ctx.strokeRect(lhx + 60, lhy + 12, 22, 20);
  ctx.strokeRect(lhx + 100, lhy + 12, 22, 20);
  // window cross frames
  for (const wx of [lhx + 31, lhx + 71, lhx + 111]) {
    ctx.beginPath(); ctx.moveTo(wx, lhy + 12); ctx.lineTo(wx, lhy + 32); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(wx - 11, lhy + 22); ctx.lineTo(wx + 11, lhy + 22); ctx.stroke();
  }

  // Right house (extends off right edge)
  const rhx = W * 0.55, rhy = H * 0.11;
  ctx.fillStyle = '#d4c4a8'; ctx.fillRect(rhx, rhy, 180, 110);
  ctx.fillStyle = '#7a4a3a'; // roof
  ctx.beginPath(); ctx.moveTo(rhx - 8, rhy); ctx.lineTo(rhx + 90, rhy - 55);
  ctx.lineTo(rhx + 188, rhy); ctx.closePath(); ctx.fill();
  // second story windows
  ctx.fillStyle = '#6a9fd8';
  ctx.fillRect(rhx + 20, rhy + 14, 24, 22); ctx.fillRect(rhx + 70, rhy + 14, 24, 22);
  ctx.fillRect(rhx + 120, rhy + 14, 24, 22);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
  ctx.strokeRect(rhx + 20, rhy + 14, 24, 22); ctx.strokeRect(rhx + 70, rhy + 14, 24, 22);
  ctx.strokeRect(rhx + 120, rhy + 14, 24, 22);
  for (const wx of [rhx + 32, rhx + 82, rhx + 132]) {
    ctx.beginPath(); ctx.moveTo(wx, rhy + 14); ctx.lineTo(wx, rhy + 36); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(wx - 12, rhy + 25); ctx.lineTo(wx + 12, rhy + 25); ctx.stroke();
  }

  // Tall trees behind fence — thick trunks, canopies off the top of the screen
  function drawTallTree(tx, trunkW) {
    // Trunk from fence line up and off screen
    ctx.fillStyle = '#5a3a20';
    ctx.fillRect(tx - trunkW / 2, -20, trunkW, H * 0.36 + 20 + 50); // extends to fence
    // Bark texture
    ctx.strokeStyle = '#4a2a15'; ctx.lineWidth = 1;
    for (let i = 0; i < 6; i++) {
      const ly = i * 25 + 10;
      ctx.beginPath(); ctx.moveTo(tx - trunkW / 2 + 2, ly); ctx.lineTo(tx + trunkW / 2 - 2, ly + 8); ctx.stroke();
    }
    // Canopy — big, mostly off screen top, just the bottom edge visible
    ctx.fillStyle = '#2d7a2d';
    ctx.beginPath(); ctx.arc(tx - 10, -10, 50, 0, 7); ctx.fill();
    ctx.fillStyle = '#3a9a3a';
    ctx.beginPath(); ctx.arc(tx + 15, -20, 45, 0, 7); ctx.fill();
    ctx.fillStyle = '#258a25';
    ctx.beginPath(); ctx.arc(tx, 10, 40, 0, 7); ctx.fill();
  }
  drawTallTree(W * 0.42, 14);
  drawTallTree(W * 0.15, 10);
  drawTallTree(W * 0.88, 12);

  // White picket fence — tall, solid
  const fenceY = H * 0.36;
  const fenceH = 50;
  // solid white fence body
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, fenceY, W, fenceH);
  // horizontal rails (subtle lines for board detail)
  ctx.fillStyle = '#e8e8e8';
  ctx.fillRect(0, fenceY + 12, W, 2);
  ctx.fillRect(0, fenceY + fenceH - 12, W, 2);
  // vertical board lines
  ctx.strokeStyle = '#e0e0e0'; ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 18) {
    ctx.beginPath(); ctx.moveTo(x, fenceY); ctx.lineTo(x, fenceY + fenceH); ctx.stroke();
  }
  // pointed tops
  ctx.fillStyle = '#fff';
  for (let x = 0; x < W; x += 18) {
    ctx.beginPath(); ctx.moveTo(x, fenceY); ctx.lineTo(x + 9, fenceY - 8); ctx.lineTo(x + 18, fenceY); ctx.fill();
  }
  // shadow under fence
  ctx.fillStyle = 'rgba(0,0,0,0.08)'; ctx.fillRect(0, fenceY + fenceH, W, 4);

  // Grass
  const grass = ctx.createLinearGradient(0, fenceY + fenceH, 0, H);
  grass.addColorStop(0, '#5a9e3a');
  grass.addColorStop(0.4, '#4a8e2e');
  grass.addColorStop(1, '#3a7a22');
  ctx.fillStyle = grass; ctx.fillRect(0, fenceY + fenceH, W, H - fenceY - fenceH);

  // Grass texture
  ctx.strokeStyle = 'rgba(30,80,15,0.3)'; ctx.lineWidth = 1;
  for (let i = 0; i < 50; i++) {
    const gx = (i * 67 + 13) % W;
    const gy = fenceY + fenceH + 6 + ((i * 43 + 7) % (H * 0.35));
    ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx + rand(-3, 3), gy - rand(4, 8)); ctx.stroke();
  }

  // Bird feeders
  function drawFeeder(fx, fy) {
    // pole
    ctx.fillStyle = '#6a5a4a'; ctx.fillRect(fx - 2, fy, 4, H * 0.3);
    // platform
    ctx.fillStyle = '#8B7355'; roundRect(fx - 18, fy - 4, 36, 6, 2); ctx.fill();
    // roof
    ctx.fillStyle = '#a0522d';
    ctx.beginPath(); ctx.moveTo(fx - 22, fy - 4); ctx.lineTo(fx, fy - 20); ctx.lineTo(fx + 22, fy - 4); ctx.closePath(); ctx.fill();
    // seed
    ctx.fillStyle = '#d4b06a';
    ctx.beginPath(); ctx.ellipse(fx, fy - 1, 12, 3, 0, 0, 7); ctx.fill();
  }
  drawFeeder(W * 0.28, H * 0.55);
  drawFeeder(W * 0.72, H * 0.52);

  // Cookie plate on the grass
  const px = W * 0.50, py = H * 0.85;
  ctx.fillStyle = '#e9e2d6'; ctx.beginPath(); ctx.ellipse(px, py, 26, 9, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#c98a4b'; ctx.beginPath(); ctx.arc(px - 6, py - 3, 7, 0, 7); ctx.arc(px + 7, py - 2, 7, 0, 7); ctx.fill();

  // Draw critters
  updateCritters(1/60);
  for (const c of critters) {
    if (c.type === 'bird') {
      const wingFlap = c.atFeeder ? 0 : Math.sin(c.bob * 12) * 0.4;
      ctx.fillStyle = c.color;
      ctx.beginPath(); ctx.ellipse(c.x, c.y, 7, 5, 0, 0, 7); ctx.fill(); // body
      ctx.fillStyle = '#333';
      ctx.beginPath(); ctx.arc(c.x + 5, c.y - 2, 3, 0, 7); ctx.fill(); // head
      ctx.fillStyle = '#fa0'; // beak
      ctx.beginPath(); ctx.moveTo(c.x + 8, c.y - 2); ctx.lineTo(c.x + 12, c.y - 1); ctx.lineTo(c.x + 8, c.y); ctx.fill();
      // wings
      ctx.fillStyle = c.color;
      ctx.save(); ctx.translate(c.x - 2, c.y - 3);
      ctx.beginPath(); ctx.ellipse(0, 0, 8, 3, -0.3 + wingFlap, 0, Math.PI); ctx.fill();
      ctx.restore();
      // tail
      ctx.fillStyle = c.color;
      ctx.beginPath(); ctx.moveTo(c.x - 7, c.y); ctx.lineTo(c.x - 13, c.y - 3); ctx.lineTo(c.x - 12, c.y + 2); ctx.fill();
      // eye
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(c.x + 6, c.y - 3, 1.5, 0, 7); ctx.fill();
      ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(c.x + 6.5, c.y - 3, 0.7, 0, 7); ctx.fill();
      // pecking animation
      if (c.atFeeder && Math.sin(c.bob * 6) > 0.3) {
        ctx.fillStyle = '#d4b06a'; ctx.beginPath(); ctx.arc(c.x + 10, c.y + 2, 1.5, 0, 7); ctx.fill();
      }
    } else {
      // Squirrel
      const bob = c.atFeeder ? Math.sin(c.bob * 4) * 1.5 : 0;
      ctx.fillStyle = c.color;
      ctx.beginPath(); ctx.ellipse(c.x, c.y + bob, 8, 6, 0, 0, 7); ctx.fill(); // body
      ctx.beginPath(); ctx.arc(c.x + 6, c.y - 4 + bob, 5, 0, 7); ctx.fill(); // head
      // fluffy tail
      ctx.fillStyle = '#a07a20';
      ctx.beginPath(); ctx.ellipse(c.x - 10, c.y - 6 + bob, 5, 10, -0.4, 0, 7); ctx.fill();
      // ears
      ctx.fillStyle = c.color;
      ctx.beginPath(); ctx.arc(c.x + 4, c.y - 8 + bob, 2, 0, 7); ctx.arc(c.x + 8, c.y - 8 + bob, 2, 0, 7); ctx.fill();
      // eye
      ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(c.x + 8, c.y - 4 + bob, 1, 0, 7); ctx.fill();
      // eating
      if (c.atFeeder && Math.sin(c.bob * 5) > 0) {
        ctx.fillStyle = '#d4b06a'; ctx.beginPath(); ctx.arc(c.x + 10, c.y - 2 + bob, 1.5, 0, 7); ctx.fill();
      }
    }
  }
}

/* ══════════════════════ RIVER SCENE ══════════════════════ */

const floaters = [];
let floaterTimer = 0;
function updateFloaters(dt) {
  floaterTimer -= dt;
  if (floaterTimer <= 0 && floaters.length < 3) {
    floaterTimer = rand(4, 9);
    floaters.push({
      type: Math.random() < 0.5 ? 'kayak' : 'tube',
      x: W + 40,
      y: H * 0.46 + rand(-8, 8),
      speed: rand(18, 35),
      bob: rand(0, 6),
      color: pick(['#e04040','#4080e0','#e0a020','#40b040','#e07a8b','#8040c0']),
      personColor: pick(['#ffe0c2','#d4a574','#8d6e4c','#f5d0b0']),
    });
  }
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.x -= f.speed * dt;
    f.bob += dt;
    if (f.x < -50) floaters.splice(i, 1);
  }
}

function drawRiver() {
  const t = sceneTime;

  // Sky
  const sky = ctx.createLinearGradient(0, 0, 0, H * 0.35);
  sky.addColorStop(0, '#5a9ed6');
  sky.addColorStop(1, '#a8d4f0');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H * 0.35);

  // Clouds
  drawCloud(W * 0.25 + Math.sin(t * 0.08) * 10, H * 0.07, 0.7);
  drawCloud(W * 0.7 + Math.sin(t * 0.06 + 2) * 8, H * 0.11, 0.9);

  // Far tree line
  ctx.fillStyle = '#2a6a2a';
  for (let x = 0; x < W; x += 18) {
    const h = 25 + Math.sin(x * 0.07 + 1) * 10 + Math.sin(x * 0.13) * 6;
    ctx.beginPath(); ctx.arc(x, H * 0.35, h, Math.PI, 0); ctx.fill();
  }

  // River bank (far side)
  ctx.fillStyle = '#6a9a40';
  ctx.fillRect(0, H * 0.33, W, H * 0.07);
  ctx.fillStyle = '#8B7355';
  ctx.fillRect(0, H * 0.38, W, 4);

  // River water
  const riverTop = H * 0.39;
  const riverBot = H * 0.58;
  const river = ctx.createLinearGradient(0, riverTop, 0, riverBot);
  river.addColorStop(0, '#2878a8');
  river.addColorStop(0.5, '#1a6898');
  river.addColorStop(1, '#2080a8');
  ctx.fillStyle = river;
  ctx.fillRect(0, riverTop, W, riverBot - riverTop);

  // River current ripples
  ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 1.5;
  for (let row = 0; row < 4; row++) {
    const ry = riverTop + 5 + row * (riverBot - riverTop) / 4;
    ctx.beginPath();
    for (let x = 0; x <= W; x += 3) {
      const y = ry + Math.sin(x * 0.04 + t * 0.8 + row * 2) * 2;
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  // Sun sparkles on water
  ctx.fillStyle = 'rgba(255,255,200,0.4)';
  for (let i = 0; i < 8; i++) {
    const sx = ((i * 97 + t * 15) % (W + 40)) - 20;
    const sy = riverTop + ((i * 53 + 11) % (riverBot - riverTop - 4));
    if (Math.sin(t * 3 + i * 1.7) > 0.6) {
      ctx.beginPath(); ctx.arc(sx, sy, 1.5, 0, 7); ctx.fill();
    }
  }

  // Draw floaters (kayakers and tubers)
  updateFloaters(1/60);
  for (const f of floaters) {
    const bobY = Math.sin(f.bob * 2.5) * 3;
    const fy = f.y + bobY;

    if (f.type === 'kayak') {
      // Kayak hull
      ctx.fillStyle = f.color;
      ctx.beginPath();
      ctx.moveTo(f.x - 20, fy); ctx.quadraticCurveTo(f.x - 24, fy + 6, f.x - 16, fy + 6);
      ctx.lineTo(f.x + 16, fy + 6); ctx.quadraticCurveTo(f.x + 24, fy + 6, f.x + 20, fy);
      ctx.closePath(); ctx.fill();
      // Person
      ctx.fillStyle = f.personColor;
      ctx.beginPath(); ctx.arc(f.x, fy - 5, 4, 0, 7); ctx.fill(); // head
      ctx.fillStyle = pick(['#e04040','#4080e0','#e0a020']);
      ctx.fillRect(f.x - 3, fy - 1, 6, 5); // torso/pfd
      // Paddle
      const paddleAngle = Math.sin(f.bob * 3) * 0.6;
      ctx.save(); ctx.translate(f.x, fy);
      ctx.strokeStyle = '#666'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(-14, -4); ctx.lineTo(14, 4 + paddleAngle * 8); ctx.stroke();
      ctx.fillStyle = '#888';
      ctx.fillRect(-16, -6, 5, 4); ctx.fillRect(12, 2 + paddleAngle * 8, 5, 4);
      ctx.restore();
      // Wake
      ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(f.x + 22, fy + 3);
      ctx.quadraticCurveTo(f.x + 35, fy + 6, f.x + 50, fy + 2); ctx.stroke();
    } else {
      // Inner tube
      ctx.fillStyle = f.color;
      ctx.beginPath(); ctx.ellipse(f.x, fy + 2, 14, 10, 0, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,0.15)';
      ctx.beginPath(); ctx.ellipse(f.x, fy + 2, 8, 5, 0, 0, 7); ctx.fill(); // hole
      // Person lounging
      ctx.fillStyle = f.personColor;
      ctx.beginPath(); ctx.arc(f.x - 4, fy - 6, 4, 0, 7); ctx.fill(); // head
      ctx.fillRect(f.x - 6, fy - 2, 8, 4); // body reclined
      // Legs dangling in water
      ctx.fillStyle = f.personColor;
      ctx.fillRect(f.x + 4, fy + 2, 3, 8);
      ctx.fillRect(f.x + 9, fy + 3, 3, 7);
      // Sunglasses
      ctx.fillStyle = '#222';
      ctx.fillRect(f.x - 6, fy - 7, 5, 2);
    }
  }

  // Near river bank
  ctx.fillStyle = '#8B7355';
  ctx.fillRect(0, riverBot - 2, W, 4);
  ctx.fillStyle = '#6a9a40';
  ctx.fillRect(0, riverBot + 1, W, 6);

  // Grassy ground
  const ground = ctx.createLinearGradient(0, riverBot + 4, 0, H);
  ground.addColorStop(0, '#5a9e3a');
  ground.addColorStop(0.5, '#4a8e2e');
  ground.addColorStop(1, '#3a7a22');
  ctx.fillStyle = ground; ctx.fillRect(0, riverBot + 4, W, H - riverBot - 4);

  // Grass blades
  ctx.strokeStyle = 'rgba(30,80,15,0.3)'; ctx.lineWidth = 1;
  for (let i = 0; i < 40; i++) {
    const gx = (i * 73 + 11) % W;
    const gy = riverBot + 10 + ((i * 47 + 9) % (H * 0.3));
    ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx + rand(-3, 3), gy - rand(4, 8)); ctx.stroke();
  }

  // Rocks by the river
  ctx.fillStyle = '#8a8070';
  ctx.beginPath(); ctx.ellipse(W * 0.15, riverBot + 6, 12, 7, 0.2, 0, 7); ctx.fill();
  ctx.fillStyle = '#9a9080';
  ctx.beginPath(); ctx.ellipse(W * 0.85, riverBot + 8, 10, 6, -0.1, 0, 7); ctx.fill();
  ctx.fillStyle = '#7a7060';
  ctx.beginPath(); ctx.ellipse(W * 0.82, riverBot + 5, 6, 4, 0.3, 0, 7); ctx.fill();

  // Cookie plate on the grass
  const px = W * 0.50, py = H * 0.82;
  ctx.fillStyle = '#e9e2d6'; ctx.beginPath(); ctx.ellipse(px, py, 26, 9, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#c98a4b'; ctx.beginPath(); ctx.arc(px - 6, py - 3, 7, 0, 7); ctx.arc(px + 7, py - 2, 7, 0, 7); ctx.fill();

  // Wildflowers
  const flowers = ['#e07a8b','#e0a020','#9060c0','#fff'];
  for (let i = 0; i < 12; i++) {
    const fx = (i * 83 + 23) % W;
    const fy = riverBot + 16 + ((i * 59 + 17) % (H * 0.28));
    ctx.fillStyle = flowers[i % flowers.length];
    ctx.beginPath(); ctx.arc(fx, fy, 2.5, 0, 7); ctx.fill();
    ctx.fillStyle = '#3a7a22'; ctx.fillRect(fx - 0.5, fy, 1, 5);
  }
}

function drawPet(){
  const acting = pet.animLock > 0;

  // choose which sheet, row and frame to draw
  let sh, row, frame;
  if (acting && (pet.action==='eat' || pet.action==='draw') && sheets[pet.action] && sheets[pet.action].ready){
    sh = sheets[pet.action];                         // dedicated action animation
    row = 0;
    frame = pet.frame % sh.cfg.cols;
  } else if (!acting && isCrying() && sheets.cry && sheets.cry.ready){
    sh = sheets.cry;                                 // sobbing when neglected
    row = 0;
    frame = pet.frame % sh.cfg.cols;
  } else if (sheets.walk && sheets.walk.ready){
    sh = sheets.walk;
    row = sh.cfg.rowMap[acting ? 'down' : pet.dir] ?? 0;   // face forward while acting
    frame = (!acting && pet.moving) ? (pet.frame % sh.cfg.cols) : 0;
  } else {
    // art still loading -> placeholder so the game is playable
    const size = 84;
    const bob = Math.sin(pet.bob*6) * (pet.moving?2.5:1.2);
    ctx.fillStyle = 'rgba(0,0,0,.15)';
    ctx.beginPath(); ctx.ellipse(pet.x, pet.y-6, size*0.30, size*0.10, 0, 0, 7); ctx.fill();
    drawPlaceholder(pet.x, pet.y - size*0.55 + bob, size);
    return;
  }

  const dispH = sh.cfg.displayH || 150;
  const dispW = dispH * (sh.fw / sh.fh);
  const bob = (!acting && pet.moving) ? Math.abs(Math.sin(pet.bob*10)) * 3 : 0;
  const foot = (sh.cfg.footInset || 0) * dispH;    // shift down so feet meet the floor
  const feetX = pet.x, feetY = pet.y + foot;

  // shadow (pinned to the ground line, doesn't bob or shift with footInset)
  ctx.fillStyle = 'rgba(0,0,0,.16)';
  ctx.beginPath(); ctx.ellipse(pet.x, pet.y-4, dispW*0.32, dispH*0.05, 0, 0, 7); ctx.fill();

  ctx.drawImage(
    sh.canvas,
    frame*sh.fw, row*sh.fh, sh.fw, sh.fh,
    feetX - dispW/2, feetY - dispH - bob, dispW, dispH
  );

  // hugging has no dedicated sheet yet -> float a heart above her head
  if (acting && pet.action==='hug'){
    ctx.font = '24px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('💗', feetX, feetY - dispH + 4 + Math.sin(pet.bob*5)*3);
  }
}

/* Placeholder "her": a friendly blob shown only while the walk sheet loads. */
function drawPlaceholder(gx, gy, size){
  const mi = moodInfo();
  ctx.save();
  ctx.translate(gx, gy);

  const squash = pet.moving ? 1+Math.sin(pet.bob*12)*0.04 : 1;
  const r = size*0.34;

  // body
  ctx.fillStyle = getVar('--accent2');
  ctx.beginPath(); ctx.ellipse(0, 0, r*0.9, r*squash, 0, 0, 7); ctx.fill();
  // head
  ctx.fillStyle = '#ffe0c2';
  ctx.beginPath(); ctx.arc(0, -r*1.05, r*0.66, 0, 7); ctx.fill();
  // hair
  ctx.fillStyle = '#6b4a34';
  ctx.beginPath(); ctx.arc(0, -r*1.25, r*0.68, Math.PI, 0); ctx.fill();
  ctx.fillRect(-r*0.68, -r*1.25, r*0.22, r*0.9);
  ctx.fillRect( r*0.46, -r*1.25, r*0.22, r*0.9);
  // eyes
  ctx.fillStyle = '#3a2a20';
  const eo = (mi.key==='sad') ? 0.6 : 1;
  ctx.beginPath(); ctx.arc(-r*0.22, -r*1.02, 2.6*eo, 0, 7); ctx.arc(r*0.22, -r*1.02, 2.6*eo, 0, 7); ctx.fill();
  // mouth by mood
  ctx.strokeStyle = '#b5544f'; ctx.lineWidth = 2.2; ctx.beginPath();
  if (mi.key==='happy'){ ctx.arc(0, -r*0.82, r*0.24, 0.15*Math.PI, 0.85*Math.PI); }
  else if (mi.key==='sad'){ ctx.arc(0, -r*0.70, r*0.24, 1.15*Math.PI, 1.85*Math.PI); }
  else { ctx.moveTo(-r*0.14, -r*0.80); ctx.lineTo(r*0.14, -r*0.80); }
  ctx.stroke();
  // cheeks
  ctx.fillStyle = 'rgba(224,122,139,.5)';
  ctx.beginPath(); ctx.arc(-r*0.34, -r*0.90, 3, 0, 7); ctx.arc(r*0.34, -r*0.90, 3, 0, 7); ctx.fill();

  // little prop hints per action
  if (pet.animLock > 0){
    ctx.font = (r*0.9)+'px serif'; ctx.textAlign='center';
    const em = pet.action==='eat' ? '🍪' : pet.action==='draw' ? '🎨' : '💗';
    ctx.fillText(em, r*0.9, -r*0.2);
  }
  ctx.restore();
}

/* utils */
function roundRect(x,y,w,h,rr){ ctx.beginPath(); ctx.moveTo(x+rr,y); ctx.arcTo(x+w,y,x+w,y+h,rr); ctx.arcTo(x+w,y+h,x,y+h,rr); ctx.arcTo(x,y+h,x,y,rr); ctx.arcTo(x,y,x+w,y,rr); ctx.closePath(); }
function getVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

/* ---------- boot ---------- */
document.getElementById('startBtn').addEventListener('click', ()=>{
  document.getElementById('banner').classList.add('hide');
  started = true;
  say('Hi! 💛');
  save();
});
resize();
refreshHUD();
requestAnimationFrame(loop);
window.addEventListener('beforeunload', save);
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walk</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  const WALK_SPEED = 60;
  const TILE_VARIANTS = 3;
  const CROSSFADE_PX = 120;
  const FADE_STRIPS = 8;

  const LAYER_DEFS = [
    { key: 'mountains',  speed: 0.05, yStart: 0.00, height: 0.88 },
    { key: 'hills',      speed: 0.10, yStart: 0.35, height: 0.53 },
    { key: 'skyline',    speed: 0.18, yStart: 0.25, height: 0.63 },
    { key: 'industrial', speed: 0.28, yStart: 0.38, height: 0.50 },
    { key: 'suburbs',    speed: 0.40, yStart: 0.48, height: 0.40 },
    { key: 'farms',      speed: 0.55, yStart: 0.38, height: 0.50 },
    { key: 'trees',      speed: 0.75, yStart: 0.30, height: 0.58 },
    { key: 'forest',     speed: 1.0,  yStart: 0.25, height: 0.63 },
  ];

  const GROUND_Y = 0.88;
  const SPRITE_SHEET = '../birthday/sprites/walking-all/paul-walk.png';
  const SPRITE_FRAME = 256;
  const WALK_ROW = 2;
  const WALK_FRAMES = 4;
  const WALK_FPS = 10;
  const CHAR_H_RATIO = 0.22;

  let W, H;
  let scrollOffset = 0;
  let spriteImg = null;
  let spriteLoaded = false;
  let frameIndex = 0;
  let frameTimer = 0;

  // Deterministic PRNG
  function mulberry32(seed) {
    return () => {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  const SEQUENCE_LEN = 200;
  const layerAssets = {};
  const tileSequences = {};

  function buildSequence(key, count) {
    const rng = mulberry32(key.length * 7 + key.charCodeAt(0) * 31);
    const seq = [];
    let last = -1;
    for (let i = 0; i < SEQUENCE_LEN; i++) {
      let idx = Math.floor(rng() * count);
      if (count > 1 && idx === last) idx = (idx + 1) % count;
      seq.push(idx);
      last = idx;
    }
    return seq;
  }

  // Load sprite
  const sImg = new Image();
  sImg.onload = () => { spriteLoaded = true; spriteImg = sImg; };
  sImg.src = SPRITE_SHEET;

  // Load tile variants
  LAYER_DEFS.forEach(layer => {
    layerAssets[layer.key] = [];
    for (let i = 1; i <= TILE_VARIANTS; i++) {
      const img = new Image();
      img.onload = () => {
        layerAssets[layer.key].push(img);
        tileSequences[layer.key] = buildSequence(layer.key, layerAssets[layer.key].length);
      };
      img.src = `assets/${layer.key}_${i}.png`;
    }
  });

  // --- Clouds (pre-generated positions) ---
  const clouds = [];
  {
    const rng = mulberry32(42);
    for (let i = 0; i < 12; i++) {
      clouds.push({
        x: rng() * 3000,
        y: rng() * 0.25,
        w: 120 + rng() * 200,
        h: 30 + rng() * 40,
        alpha: 0.04 + rng() * 0.08,
        speed: 0.02 + rng() * 0.03,
        blobs: Math.floor(3 + rng() * 4),
      });
    }
  }

  // --- Birds (pre-generated flocks) ---
  const birds = [];
  {
    const rng = mulberry32(77);
    for (let i = 0; i < 8; i++) {
      const flock = [];
      const count = 2 + Math.floor(rng() * 5);
      for (let b = 0; b < count; b++) {
        flock.push({ dx: rng() * 30 - 15, dy: rng() * 20 - 10 });
      }
      birds.push({
        x: rng() * 2000,
        y: 0.08 + rng() * 0.25,
        speed: 0.06 + rng() * 0.06,
        size: 3 + rng() * 4,
        flock,
      });
    }
  }

  // --- Foreground grass tufts (pre-generated) ---
  const grassTufts = [];
  {
    const rng = mulberry32(123);
    for (let i = 0; i < 60; i++) {
      grassTufts.push({
        xOffset: rng() * 800,       // repeating tile offset
        blades: 3 + Math.floor(rng() * 5),
        maxH: 8 + rng() * 18,
        lean: (rng() - 0.5) * 0.3,
        hue: 60 + Math.floor(rng() * 60),
        sat: 30 + Math.floor(rng() * 40),
        light: 15 + Math.floor(rng() * 20),
      });
    }
  }

  // --- Fireflies / pollen ---
  const fireflies = [];
  {
    const rng = mulberry32(99);
    for (let i = 0; i < 40; i++) {
      fireflies.push({
        phase: rng() * Math.PI * 2,
        xBase: rng() * 2000,
        yBase: 0.5 + rng() * 0.45,
        radius: 1 + rng() * 2,
        driftX: 20 + rng() * 40,
        driftY: 10 + rng() * 20,
        speedX: 0.3 + rng() * 0.5,
        speedY: 0.5 + rng() * 0.8,
        pulseSpeed: 1 + rng() * 3,
        warm: rng() > 0.5, // warm yellow vs cool green
      });
    }
  }

  // Resize
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // Sky
  let skyGrad = null;
  let skyGradH = 0;
  function drawSky() {
    if (skyGradH !== H) {
      skyGrad = ctx.createLinearGradient(0, 0, 0, H);
      skyGrad.addColorStop(0, '#0a0015');
      skyGrad.addColorStop(0.25, '#1a0a3e');
      skyGrad.addColorStop(0.45, '#3a1a1e');
      skyGrad.addColorStop(0.65, '#8a4a1e');
      skyGrad.addColorStop(0.80, '#ca8a3e');
      skyGrad.addColorStop(1, '#eaaa4e');
      skyGradH = H;
    }
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, H);

    // Sun disc + glow
    const sunX = W * 0.75, sunY = H * 0.25;
    const sunR = Math.min(W, H) * 0.18;
    const sunGrad = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sunR);
    sunGrad.addColorStop(0, 'rgba(255, 240, 200, 1)');
    sunGrad.addColorStop(0.08, 'rgba(255, 230, 170, 0.9)');
    sunGrad.addColorStop(0.2, 'rgba(255, 200, 120, 0.5)');
    sunGrad.addColorStop(0.5, 'rgba(255, 160, 80, 0.12)');
    sunGrad.addColorStop(1, 'rgba(255, 150, 50, 0)');
    ctx.fillStyle = sunGrad;
    ctx.fillRect(0, 0, W, H);
  }

  // Clouds
  function drawClouds() {
    for (const c of clouds) {
      const cx = ((c.x - scrollOffset * c.speed) % (W + c.w * 2)) - c.w;
      const cy = c.y * H;
      ctx.fillStyle = `rgba(255, 230, 200, ${c.alpha})`;
      for (let b = 0; b < c.blobs; b++) {
        const bx = cx + (b / c.blobs) * c.w;
        const by = cy + Math.sin(b * 1.8) * c.h * 0.3;
        const br = c.h * (0.6 + 0.4 * Math.sin(b * 2.3 + 0.5));
        ctx.beginPath();
        ctx.ellipse(bx, by, br * 1.8, br, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // Birds
  function drawBirds(time) {
    ctx.strokeStyle = 'rgba(30, 20, 15, 0.4)';
    ctx.lineWidth = 1.5;
    for (const b of birds) {
      const bx = ((b.x - scrollOffset * b.speed) % (W + 200)) - 100;
      const by = b.y * H + Math.sin(time * 0.001 + b.x) * 8;
      for (const f of b.flock) {
        const fx = bx + f.dx;
        const fy = by + f.dy;
        const wing = Math.sin(time * 0.006 + f.dx * 0.5) * b.size;
        ctx.beginPath();
        ctx.moveTo(fx - b.size, fy + wing);
        ctx.quadraticCurveTo(fx, fy - Math.abs(wing) * 0.5, fx + b.size, fy + wing);
        ctx.stroke();
      }
    }
  }

  // God rays from sun
  function drawGodRays(time) {
    const sunX = W * 0.75, sunY = H * 0.25;
    const rayCount = 7;
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    for (let i = 0; i < rayCount; i++) {
      const angle = (i / rayCount) * Math.PI * 0.6 + Math.PI * 0.4
        + Math.sin(time * 0.0003 + i * 2) * 0.05;
      const length = H * (0.6 + 0.2 * Math.sin(time * 0.0005 + i * 1.5));
      const width = 15 + 10 * Math.sin(time * 0.0004 + i * 3);
      const endX = sunX + Math.cos(angle) * length;
      const endY = sunY + Math.sin(angle) * length;
      const grad = ctx.createLinearGradient(sunX, sunY, endX, endY);
      grad.addColorStop(0, 'rgba(255, 200, 120, 0.03)');
      grad.addColorStop(0.5, 'rgba(255, 180, 80, 0.015)');
      grad.addColorStop(1, 'rgba(255, 160, 60, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      const perpX = -Math.sin(angle) * width;
      const perpY = Math.cos(angle) * width;
      ctx.moveTo(sunX + perpX, sunY + perpY);
      ctx.lineTo(sunX - perpX, sunY - perpY);
      ctx.lineTo(endX - perpX * 3, endY - perpY * 3);
      ctx.lineTo(endX + perpX * 3, endY + perpY * 3);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  // Tile layer rendering
  function drawTileLayer(layer) {
    const pool = layerAssets[layer.key];
    const seq = tileSequences[layer.key];
    if (!pool.length || !seq) return false;

    const y = layer.yStart * H;
    const h = layer.height * H;
    const offset = scrollOffset * layer.speed;

    const aspect = pool[0].width / pool[0].height;
    const drawW = h * aspect;
    if (drawW <= 0) return false;

    const spacing = drawW - CROSSFADE_PX;
    if (spacing <= 0) return false;

    const firstSlot = Math.floor(offset / spacing);
    const slotOffset = offset - firstSlot * spacing;
    const needed = Math.ceil((W + slotOffset) / spacing) + 1;
    const stripW = Math.ceil(CROSSFADE_PX / FADE_STRIPS);

    for (let i = 0; i < needed; i++) {
      const slot = firstSlot + i;
      const seqIdx = ((slot % SEQUENCE_LEN) + SEQUENCE_LEN) % SEQUENCE_LEN;
      const img = pool[seq[seqIdx] % pool.length];
      const x = Math.round(i * spacing - slotOffset);

      const bodyLeft = (i > 0) ? x + CROSSFADE_PX : x;
      const bodyRight = x + drawW - CROSSFADE_PX;
      if (bodyRight > bodyLeft) {
        ctx.globalAlpha = 1;
        ctx.save();
        ctx.beginPath();
        ctx.rect(bodyLeft, y, bodyRight - bodyLeft, h);
        ctx.clip();
        ctx.drawImage(img, x, y, drawW, h);
        ctx.restore();
      }

      if (i > 0) {
        for (let s = 0; s < FADE_STRIPS; s++) {
          ctx.globalAlpha = (s + 0.5) / FADE_STRIPS;
          ctx.save();
          ctx.beginPath();
          ctx.rect(x + s * stripW, y, stripW, h);
          ctx.clip();
          ctx.drawImage(img, x, y, drawW, h);
          ctx.restore();
        }
      }

      const fadeOutX = x + drawW - CROSSFADE_PX;
      for (let s = 0; s < FADE_STRIPS; s++) {
        ctx.globalAlpha = 1 - (s + 0.5) / FADE_STRIPS;
        ctx.save();
        ctx.beginPath();
        ctx.rect(fadeOutX + s * stripW, y, stripW, h);
        ctx.clip();
        ctx.drawImage(img, x, y, drawW, h);
        ctx.restore();
      }
    }
    ctx.globalAlpha = 1;
    return true;
  }

  // Ground with path, pebbles, grass edges
  function drawGround() {
    const y = GROUND_Y * H;
    const groundH = H - y;

    // Base earth gradient
    const grad = ctx.createLinearGradient(0, y, 0, H);
    grad.addColorStop(0, '#6a5a38');
    grad.addColorStop(0.15, '#5a4a28');
    grad.addColorStop(0.4, '#3a2a18');
    grad.addColorStop(1, '#1a1008');
    ctx.fillStyle = grad;
    ctx.fillRect(0, y, W, groundH);

    // Worn path (lighter strip)
    const pathY = y + groundH * 0.15;
    const pathH = groundH * 0.35;
    const pathGrad = ctx.createLinearGradient(0, pathY, 0, pathY + pathH);
    pathGrad.addColorStop(0, 'rgba(120, 100, 60, 0.3)');
    pathGrad.addColorStop(0.5, 'rgba(130, 110, 70, 0.4)');
    pathGrad.addColorStop(1, 'rgba(100, 80, 50, 0.2)');
    ctx.fillStyle = pathGrad;
    ctx.fillRect(0, pathY, W, pathH);

    // Dirt texture lines (perspective)
    ctx.strokeStyle = 'rgba(80, 60, 30, 0.2)';
    ctx.lineWidth = 1;
    const off = -(scrollOffset % 20);
    for (let lx = off; lx < W; lx += 20) {
      const rx = Math.round(lx);
      ctx.beginPath(); ctx.moveTo(rx, y + 2); ctx.lineTo(rx - 10, H); ctx.stroke();
    }

    // Pebbles
    const pebbleOff = -(scrollOffset % 800);
    const rng = mulberry32(55);
    for (let i = 0; i < 40; i++) { rng(); } // burn some values for stability
    for (let px = pebbleOff; px < W + 20; px += 18) {
      const seed = Math.round((px + scrollOffset) / 18);
      const py = y + groundH * (0.1 + 0.7 * Math.abs(Math.sin(seed * 3.7 + 0.5)));
      const pr = 1.5 + (seed % 3);
      const bright = 40 + (seed * 13) % 30;
      ctx.fillStyle = `rgba(${bright + 30}, ${bright + 20}, ${bright}, 0.4)`;
      ctx.beginPath();
      ctx.ellipse(px, py, pr * 1.3, pr, (seed % 6) * 0.5, 0, Math.PI * 2);
      ctx.fill();
    }

    // Grass edge along top of ground
    const grassOff = -(scrollOffset % 600);
    for (let gx = grassOff - 20; gx < W + 20; gx += 5) {
      const seed = Math.round((gx + scrollOffset) / 5);
      const gh = 4 + (seed % 8);
      const lean = Math.sin(seed * 2.3) * 2 + Math.sin(scrollOffset * 0.02 + seed) * 1;
      const green = 50 + (seed * 7) % 50;
      ctx.strokeStyle = `rgba(${30 + (seed * 3) % 20}, ${green}, ${10 + (seed * 2) % 15}, 0.6)`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(gx, y);
      ctx.quadraticCurveTo(gx + lean, y - gh * 0.6, gx + lean * 1.5, y - gh);
      ctx.stroke();
    }
  }

  // Grass tufts scattered around character level
  function drawGrassTufts() {
    const y = GROUND_Y * H;
    const tileW = 800;
    const off = -(scrollOffset % tileW);

    for (const tuft of grassTufts) {
      const tx = off + tuft.xOffset;
      // Draw at both the current tile and the next
      for (let rep = -1; rep <= 2; rep++) {
        const x = tx + rep * tileW;
        if (x < -30 || x > W + 30) continue;

        const sway = Math.sin(scrollOffset * 0.015 + tuft.xOffset * 0.1) * 3;
        for (let b = 0; b < tuft.blades; b++) {
          const bx = x + (b - tuft.blades / 2) * 3;
          const bh = tuft.maxH * (0.6 + 0.4 * Math.sin(b * 1.5));
          const blean = tuft.lean * bh + sway + Math.sin(b * 2.1) * 2;
          ctx.strokeStyle = `hsla(${tuft.hue}, ${tuft.sat}%, ${tuft.light}%, 0.7)`;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(bx, y);
          ctx.quadraticCurveTo(bx + blean * 0.5, y - bh * 0.6, bx + blean, y - bh);
          ctx.stroke();
        }
      }
    }
  }

  // Character shadow
  function drawShadow() {
    const charH = H * CHAR_H_RATIO;
    const charW = charH;
    const charX = Math.round(W * 0.3 - charW / 2);
    const shadowY = GROUND_Y * H + 2;
    const shadowW = charW * 0.7;
    const shadowH = charH * 0.1;

    ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
    ctx.beginPath();
    ctx.ellipse(charX + charW / 2 + 5, shadowY, shadowW / 2, shadowH / 2, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // Character
  function drawCharacter(dt) {
    if (!spriteLoaded) return;
    frameTimer += dt;
    if (frameTimer >= 1 / WALK_FPS) {
      frameTimer -= 1 / WALK_FPS;
      frameIndex = (frameIndex + 1) % WALK_FRAMES;
    }
    const charH = H * CHAR_H_RATIO;
    const charW = charH;
    const charX = Math.round(W * 0.3 - charW / 2);
    const charY = Math.round(GROUND_Y * H - charH + Math.sin(scrollOffset * 0.08) * 2);

    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(
      spriteImg,
      frameIndex * SPRITE_FRAME, WALK_ROW * SPRITE_FRAME,
      SPRITE_FRAME, SPRITE_FRAME,
      charX, charY, charW, charH
    );
    ctx.imageSmoothingEnabled = true;
  }

  // Fireflies / pollen
  function drawFireflies(time) {
    for (const f of fireflies) {
      const t = time * 0.001;
      const px = ((f.xBase + Math.sin(t * f.speedX + f.phase) * f.driftX - scrollOffset * 0.8)
        % (W + 100)) - 50;
      const py = f.yBase * H + Math.sin(t * f.speedY + f.phase * 2) * f.driftY;
      const pulse = 0.3 + 0.7 * Math.max(0, Math.sin(t * f.pulseSpeed + f.phase));
      const alpha = pulse * 0.4;
      const r = f.radius * (0.8 + 0.2 * pulse);

      if (f.warm) {
        ctx.fillStyle = `rgba(255, 230, 140, ${alpha})`;
      } else {
        ctx.fillStyle = `rgba(180, 255, 140, ${alpha * 0.7})`;
      }

      // Glow
      const glow = ctx.createRadialGradient(px, py, 0, px, py, r * 4);
      if (f.warm) {
        glow.addColorStop(0, `rgba(255, 220, 120, ${alpha * 0.5})`);
      } else {
        glow.addColorStop(0, `rgba(160, 255, 120, ${alpha * 0.3})`);
      }
      glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = glow;
      ctx.fillRect(px - r * 4, py - r * 4, r * 8, r * 8);

      // Core
      if (f.warm) {
        ctx.fillStyle = `rgba(255, 240, 180, ${alpha})`;
      } else {
        ctx.fillStyle = `rgba(200, 255, 180, ${alpha * 0.8})`;
      }
      ctx.beginPath();
      ctx.arc(px, py, r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Atmospheric haze + dust motes
  function drawAtmosphere() {
    // Depth haze
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, 'rgba(180, 120, 60, 0)');
    grad.addColorStop(0.4, 'rgba(180, 120, 60, 0.015)');
    grad.addColorStop(0.7, 'rgba(180, 120, 60, 0.04)');
    grad.addColorStop(0.88, 'rgba(100, 70, 30, 0.06)');
    grad.addColorStop(1, 'rgba(0, 0, 0, 0.35)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Dust motes
    ctx.fillStyle = 'rgba(255, 220, 150, 0.12)';
    for (let i = 0; i < 35; i++) {
      const px = ((i * 137.5 + scrollOffset * 0.15 * (0.5 + i * 0.015)) % (W + 20)) - 10;
      const py = (i * 89.3 + Math.sin(scrollOffset * 0.008 + i) * 30) % H;
      const r = 1 + (i % 3);
      ctx.beginPath();
      ctx.arc(px, py, r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Vignette
  function drawVignette() {
    // Corner darkening
    const vig = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
    vig.addColorStop(0, 'rgba(0, 0, 0, 0)');
    vig.addColorStop(0.7, 'rgba(0, 0, 0, 0)');
    vig.addColorStop(1, 'rgba(0, 0, 0, 0.4)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);

    // Top strip (cinematic letterbox hint)
    const topGrad = ctx.createLinearGradient(0, 0, 0, H * 0.06);
    topGrad.addColorStop(0, 'rgba(0, 0, 0, 0.3)');
    topGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = topGrad;
    ctx.fillRect(0, 0, W, H * 0.06);

    // Bottom strip
    const botGrad = ctx.createLinearGradient(0, H * 0.95, 0, H);
    botGrad.addColorStop(0, 'rgba(0, 0, 0, 0)');
    botGrad.addColorStop(1, 'rgba(0, 0, 0, 0.5)');
    ctx.fillStyle = botGrad;
    ctx.fillRect(0, H * 0.95, W, H * 0.05);
  }

  // Main loop
  let lastTime = 0;
  function frame(time) {
    const dt = Math.min((time - lastTime) / 1000, 0.05);
    lastTime = time;
    scrollOffset += WALK_SPEED * dt;

    ctx.clearRect(0, 0, W, H);

    // Background
    drawSky();
    drawClouds();
    drawGodRays(time);

    // Parallax image layers
    for (const layer of LAYER_DEFS) {
      drawTileLayer(layer);
      // Birds between mountains and hills
      if (layer.key === 'mountains') {
        drawBirds(time);
      }
    }

    // Ground plane
    drawGround();
    drawGrassTufts();

    // Atmosphere overlay
    drawAtmosphere();

    // Character
    drawShadow();
    drawCharacter(dt);

    // Foreground effects
    drawFireflies(time);
    drawVignette();

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
